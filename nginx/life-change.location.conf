# 공유 nginx(projects-nginx-1) 의 server{} 블록 안에 이 location 을 추가한다.
# 서버: ~/projects/infra/nginx/default.conf (또는 실제 마운트 경로)
# 추가 후: docker exec projects-nginx-1 nginx -s reload
#
# 라우팅 방식: can-agent 패턴(앱이 스스로 /life-change 프리픽스를 서빙)과 동일.
# 컨테이너 네트워크 별칭 'life-change' = docker-compose 서비스명.

# ===== life-change =====
location /life-change {
    proxy_pass http://life-change:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}
