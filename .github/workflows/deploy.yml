name: Deploy life-change

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      force:
        description: "배포 가드(ops/guard.sh)를 무시하고 배포한다"
        type: boolean
        default: false
      skip_tests:
        description: "테스트를 건너뛰고 배포한다(긴급용)"
        type: boolean
        default: false
      image_tag:
        description: "이미 빌드된 이미지 태그(커밋 SHA 12자)를 그대로 배포한다 — 테스트·빌드 생략"
        type: string
        default: ""
      recreate:
        description: "이미지가 같아도 컨테이너를 다시 만든다(운영 검증용)"
        type: boolean
        default: false
      rollback:
        description: "배포 대신 되돌린다"
        type: boolean
        default: false
      rollback_tag:
        description: "롤백할 태그: 커밋 SHA 12자(레지스트리에서 받음) 또는 prev-시각. 비우면 직전 prev- 태그"
        type: string
        default: ""

concurrency:
  group: deploy-life-change-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.mode.outputs.build }}
      test: ${{ steps.mode.outputs.test }}
    steps:
      - id: mode
        env:
          ROLLBACK: ${{ inputs.rollback }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: |
          if [ -n "$IMAGE_TAG" ] && ! printf '%s' "$IMAGE_TAG" | grep -Eq '^[a-z0-9][a-z0-9._-]{0,127}$'; then
            echo "::error::image_tag 형식이 올바르지 않습니다: $IMAGE_TAG"; exit 1
          fi
          if [ -n "$ROLLBACK_TAG" ] && ! printf '%s' "$ROLLBACK_TAG" | grep -Eq '^([0-9a-f]{12}|prev-[0-9]{8}-[0-9]{6})$'; then
            echo "::error::rollback_tag 는 커밋 SHA 12자리 또는 prev-YYYYMMDD-HHMMSS 여야 합니다: $ROLLBACK_TAG"; exit 1
          fi
          if [ -n "$ROLLBACK_TAG" ] && [ "$ROLLBACK" != "true" ]; then
            echo "::error::rollback_tag 는 rollback 과 함께만 쓸 수 있습니다"; exit 1
          fi
          build=true; test=true
          if [ "$ROLLBACK" = "true" ] || [ -n "$IMAGE_TAG" ]; then build=false; test=false; fi
          if [ "$SKIP_TESTS" = "true" ]; then test=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "test=$test" >> "$GITHUB_OUTPUT"

  tests:
    needs: validate
    if: needs.validate.outputs.test == 'true'
    uses: ./.github/workflows/tests.yml

  images:
    needs: validate
    if: needs.validate.outputs.build == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml

  deploy:
    needs: [validate, tests, images]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via ops/deploy.sh
        env:
          SSH_KEY: ${{ secrets.LIFECHANGE_DEPLOY_KEY }}
          SERVER: 168.107.31.154
          USER_NAME: ubuntu
          FORCE_INPUT: ${{ inputs.force }}
          RECREATE_INPUT: ${{ inputs.recreate }}
          ROLLBACK_INPUT: ${{ inputs.rollback }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          IMAGE_TAG: ${{ inputs.image_tag || needs.images.outputs.tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::LIFECHANGE_DEPLOY_KEY 시크릿이 없습니다."
            exit 1
          fi
          printf '%s' "$GIT_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::잘못된 커밋 SHA"; exit 1; }
          FORCE=0; [ "$FORCE_INPUT" = "true" ] && FORCE=1
          RECREATE=0; [ "$RECREATE_INPUT" = "true" ] && RECREATE=1
          ROLLBACK=0; [ "$ROLLBACK_INPUT" = "true" ] && ROLLBACK=1
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$USER_NAME@$SERVER" \
            "FORCE='$FORCE' RECREATE='$RECREATE' ROLLBACK='$ROLLBACK' ROLLBACK_TAG='$ROLLBACK_TAG' IMAGE_TAG='$IMAGE_TAG' GIT_SHA='$GIT_SHA' bash -se" <<'REMOTE'
            set -euo pipefail
            cd ~/projects/life-change
            git fetch origin main
            git reset --hard "$GIT_SHA"
            bash ops/test/deploy_test.sh
            if [ "$ROLLBACK" = 1 ]; then
              ./ops/deploy.sh rollback ${ROLLBACK_TAG:+"$ROLLBACK_TAG"}
            else
              ./ops/deploy.sh
            fi
          REMOTE

      - name: Healthcheck
        env:
          SERVER: 168.107.31.154
        run: |
          code=000
          for i in $(seq 1 30); do
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -k --connect-timeout 5 "https://$SERVER/life-change/health" || echo 000)
            { [ "$code" = "200" ] || [ "$code" = "302" ]; } && break
            echo "waiting... (HTTP $code, $i/30)"
          done
          echo "HTTP $code"
          { [ "$code" = "200" ] || [ "$code" = "302" ]; } || { echo "::error::배포 헬스체크 실패 (HTTP $code)"; exit 1; }
          echo "✅ life-change 배포 성공 (HTTP $code)"
