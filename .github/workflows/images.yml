name: Build image (GHCR)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      tag:
        description: "빌드한 이미지 태그(커밋 SHA 12자)"
        value: ${{ jobs.build.outputs.tag }}

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/goottjason/life-change:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/goottjason/life-change-cache:build
          cache-to: type=registry,ref=ghcr.io/goottjason/life-change-cache:build,mode=max,image-manifest=true,oci-mediatypes=true
